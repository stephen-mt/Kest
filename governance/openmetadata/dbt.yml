source:
  type: dbt
  serviceName: kest_clickhouse
  sourceConfig:
    config:
      type: DBT
      dbtConfigSource:
        dbtConfigType: local
        dbtCatalogFilePath: /tmp/kest-dbt-metadata/catalog.json
        dbtManifestFilePath: /tmp/kest-dbt-metadata/manifest.json
        dbtRunResultsFilePath: /tmp/kest-dbt-metadata/run_results.json
      searchAcrossDatabases: true
      dbtUpdateDescriptions: true
      dbtUpdateOwners: true
      includeTags: true
      includeMetrics: true
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OPENMETADATA_INGESTION_TOKEN}
