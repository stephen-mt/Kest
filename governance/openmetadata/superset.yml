source:
  type: superset
  serviceName: kest_superset
  serviceConnection:
    config:
      type: Superset
      hostPort: http://superset:8088
      connection:
        provider: db
        username: ${SUPERSET_ADMIN_USER}
        password: ${SUPERSET_ADMIN_PASSWORD}
  sourceConfig:
    config:
      type: DashboardMetadata
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OPENMETADATA_INGESTION_TOKEN}
