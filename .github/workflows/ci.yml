name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv pip install --system --requirement requirements.txt
      - run: make lint
      - run: PYTHONPATH=src:. python -m unittest discover -s tests/unit
