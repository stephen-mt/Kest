name: Build immutable images

on:
  workflow_run:
    workflows: [Kest CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: airflow
            dockerfile: infra/images/airflow/Dockerfile
          - name: tooling
            dockerfile: infra/images/tooling.Dockerfile
          - name: superset
            dockerfile: infra/images/superset/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/stephen-mt/kest-${{ matrix.name }}:${{ github.event.workflow_run.head_sha }}
          build-args: KEST_GIT_SHA=${{ github.event.workflow_run.head_sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
