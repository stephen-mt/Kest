name: Promote immutable release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [staging, production]
      git_sha:
        description: Tested main commit to promote
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: [self-hosted, kest-platform]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Materialize protected deployment configuration
        env:
          KEST_ENV_FILE: ${{ secrets.KEST_ENV_FILE }}
          TARGET: ${{ inputs.environment }}
          RELEASE_SHA: ${{ inputs.git_sha }}
        run: |
          install -m 600 /dev/null ".env.${TARGET}"
          printf '%s\n' "${KEST_ENV_FILE}" > ".env.${TARGET}"
          printf '%s\n' \
            "KEST_ENVIRONMENT=${TARGET}" \
            "KEST_GIT_SHA=${RELEASE_SHA}" \
            "KEST_IMAGE_REF=${RELEASE_SHA}" \
            "AIRFLOW_IMAGE=ghcr.io/stephen-mt/kest-airflow:${RELEASE_SHA}" \
            "TOOLING_IMAGE=ghcr.io/stephen-mt/kest-tooling:${RELEASE_SHA}" \
            "SUPERSET_IMAGE=ghcr.io/stephen-mt/kest-superset:${RELEASE_SHA}" >> ".env.${TARGET}"
      - name: Deploy and verify platform health
        run: python3 ops/deploy.py "${{ inputs.environment }}"
