name: ${COMPOSE_PROJECT_NAME:-kest}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infra/images/airflow/Dockerfile
  image: ${AIRFLOW_IMAGE:-kest-airflow:3.3.2}
  env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__FAB__CONFIG_FILE: /opt/kest/infra/airflow/webserver_config.py
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY}
    # The browser-facing base URL must remain reachable from the host. Celery
    # tasks use a separate internal URL to report state to Airflow's execution
    # API without leaking the Compose hostname into login redirects.
    AIRFLOW__API__BASE_URL: http://127.0.0.1:8080
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__DAGS_FOLDER: /opt/kest/orchestration/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "8"
    AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW_WORKER_CONCURRENCY:-3}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    PYTHONPATH: /opt/kest:/opt/kest/ingestion:/opt/kest/orchestration
    DBT_TARGET_PATH: /opt/kest/.runtime/dbt/target
    DBT_LOG_PATH: /opt/kest/.runtime/dbt/logs
    PYTHON_DOTENV_DISABLED: "1"
    KEST_ENVIRONMENT: ${KEST_ENVIRONMENT:-local}
    KEST_GIT_SHA: ${KEST_GIT_SHA:-workspace}
    KEST_IMAGE_REF: ${KEST_IMAGE_REF:-workspace}
  volumes:
    - ./:/opt/kest:ro
    - ./.runtime:/opt/kest/.runtime
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    keycloak:
      condition: service_healthy
    redis:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
    object-store-init:
      condition: service_completed_successfully
  networks: [control, data]
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      # PostgreSQL 18 stores versioned clusters below this mount. The former
      # postgres-data volume is intentionally left untouched for rollback.
      - postgres-data-v18:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [control, data]
    restart: unless-stopped
    mem_limit: 768m

  redis:
    image: redis:8.10.1-trixie@sha256:8a1efc5f479551822b47424ccae982026b633f28818eab0387348120a61e10e2
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [control]
    restart: unless-stopped
    mem_limit: 384m

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    command:
      - start
      - --http-enabled=true
      - --hostname=http://127.0.0.1:8180
      - --hostname-backchannel-dynamic=true
      - --proxy-headers=xforwarded
      - --import-realm
    env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./infra/identity/kest-realm.json:/opt/keycloak/data/import/kest-realm.json:ro
    ports: ["127.0.0.1:8180:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 40
    networks: [control]
    restart: unless-stopped
    mem_limit: 1024m

  object-store:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ADMIN_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_ADMIN_SECRET_KEY}
    volumes: ["silo-data:/data"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [data]
    restart: unless-stopped
    mem_limit: 768m

  object-store-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mcli alias set local http://object-store:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mcli mb --ignore-existing local/raw
        mcli mb --ignore-existing local/restore-verify
        mcli mb --ignore-existing local/platform-backups
        mcli version enable local/raw
        mcli admin policy create local kest-raw-writer /policies/writer-policy.json
        mcli admin policy create local kest-raw-reader /policies/reader-policy.json
        mcli admin policy create local kest-platform-backup /policies/backup-policy.json
        mcli admin user add local "$${S3_WRITER_ACCESS_KEY}" "$${S3_WRITER_SECRET_KEY}" || mcli admin user enable local "$${S3_WRITER_ACCESS_KEY}"
        mcli admin user add local "$${S3_READER_ACCESS_KEY}" "$${S3_READER_SECRET_KEY}" || mcli admin user enable local "$${S3_READER_ACCESS_KEY}"
        mcli admin user add local "$${S3_BACKUP_ACCESS_KEY}" "$${S3_BACKUP_SECRET_KEY}" || mcli admin user enable local "$${S3_BACKUP_ACCESS_KEY}"
        mcli admin policy attach local kest-raw-writer --user "$${S3_WRITER_ACCESS_KEY}"
        mcli admin policy attach local kest-raw-reader --user "$${S3_READER_ACCESS_KEY}"
        mcli admin policy attach local kest-platform-backup --user "$${S3_BACKUP_ACCESS_KEY}"
    environment:
      MINIO_ROOT_USER: ${S3_ADMIN_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_ADMIN_SECRET_KEY}
      S3_WRITER_ACCESS_KEY: ${S3_WRITER_ACCESS_KEY}
      S3_WRITER_SECRET_KEY: ${S3_WRITER_SECRET_KEY}
      S3_READER_ACCESS_KEY: ${S3_READER_ACCESS_KEY}
      S3_READER_SECRET_KEY: ${S3_READER_SECRET_KEY}
      S3_BACKUP_ACCESS_KEY: ${S3_BACKUP_ACCESS_KEY}
      S3_BACKUP_SECRET_KEY: ${S3_BACKUP_SECRET_KEY}
    volumes:
      - ./.runtime/object-store:/policies:ro
    depends_on:
      object-store:
        condition: service_healthy
    networks: [data]
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.14.10@sha256:4dcecd874534d2ab0b13695610b7085b64451c8d01ecb0771d4a2a227c094617
    env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      # Keep the former ClickHouse volume untouched across the stable-version
      # boundary; control manifests and raw data must start from one epoch.
      - clickhouse-data-v26:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./infra/clickhouse/config/settings.xml:/etc/clickhouse-server/config.d/kest-settings.xml:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9002:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --user=default --password='$${CLICKHOUSE_ADMIN_PASSWORD}' 'http://localhost:8123/ping' | grep Ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [data]
    restart: unless-stopped
    mem_limit: ${CLICKHOUSE_MEMORY_LIMIT:-4g}

  clickhouse-restore:
    image: clickhouse/clickhouse-server:26.9.14.10@sha256:4dcecd874534d2ab0b13695610b7085b64451c8d01ecb0771d4a2a227c094617
    profiles: [recovery]
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: ["clickhouse-restore-data:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --user=default --password='$${CLICKHOUSE_ADMIN_PASSWORD}' 'http://localhost:8123/ping' | grep Ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [data]
    restart: "no"
    mem_limit: 2g

  source-api:
    build:
      context: .
      dockerfile: infra/images/tooling.Dockerfile
    image: ${TOOLING_IMAGE:-kest-tooling:0.1.0}
    profiles: [demo]
    env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
    command: ["uvicorn", "source_api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes: ["./:/opt/kest:ro"]
    ports: ["127.0.0.1:8090:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped
    mem_limit: 256m

  tooling:
    build:
      context: .
      dockerfile: infra/images/tooling.Dockerfile
    image: ${TOOLING_IMAGE:-kest-tooling:0.1.0}
    env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
    environment:
      PYTHONPATH: /opt/kest/ingestion
      DBT_TARGET_PATH: /opt/kest/.runtime/dbt/target
      DBT_LOG_PATH: /opt/kest/.runtime/dbt/logs
      PYTHON_DOTENV_DISABLED: "1"
    volumes: ["./:/opt/kest"]
    working_dir: /opt/kest
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
    networks: [control, data]
    profiles: [tools]

  airflow-init:
    <<: *airflow-common
    restart: "no"
    command: ["python", "/opt/kest/ops/airflow_init.py"]

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME}"]
      interval: 15s
      timeout: 10s
      retries: 30
    mem_limit: 2048m

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer

  superset-init:
    build:
      context: .
      dockerfile: infra/images/superset/Dockerfile
    image: ${SUPERSET_IMAGE:-kest-superset:6.1.0}
    env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
    environment: &superset-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DATABASE_URI: postgresql+psycopg2://superset:${SUPERSET_DB_PASSWORD}@postgres:5432/superset
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KEST_AUTH_MODE: ${KEST_AUTH_MODE:-oidc}
      SUPERSET_OIDC_CLIENT_SECRET: ${SUPERSET_OIDC_CLIENT_SECRET}
    command: ["python", "/opt/kest/ops/superset_init.py"]
    volumes: ["./:/opt/kest:ro"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [control, data]
    restart: "no"

  superset:
    image: ${SUPERSET_IMAGE:-kest-superset:6.1.0}
    env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
    environment: *superset-env
    command: ["/app/docker/entrypoints/run-server.sh"]
    ports: ["127.0.0.1:8088:8088"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [control, data]
    restart: unless-stopped
    mem_limit: 1024m

  superset-worker:
    image: ${SUPERSET_IMAGE:-kest-superset:6.1.0}
    env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
    environment: *superset-env
    command: ["celery", "--app=superset.tasks.celery_app:app", "worker", "--pool=prefork", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery --app=superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME | grep pong"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [control, data]
    restart: unless-stopped
    mem_limit: 768m

  opensearch:
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    profiles: [catalog]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: ["opensearch-data:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 40
    networks: [control]
    mem_limit: 1536m

  openmetadata-migrate:
    image: docker.getcollate.io/openmetadata/server:2.0.5@sha256:ede23602d8e7cc2447e14f67b36d8ee2e468671fb3157a39e776ecfd6d7cc11b
    profiles: [catalog]
    env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
    environment: &om-env
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USE_SSL: "false"
      DB_USER: openmetadata
      DB_USER_PASSWORD: ${OPENMETADATA_DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      OM_DATABASE: openmetadata
      ELASTICSEARCH_HOST: opensearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      ELASTICSEARCH_CLUSTER_ALIAS: openmetadata
      SEARCH_TYPE: opensearch
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"
      SERVER_HOST_API_URL: http://openmetadata-server:8585/api
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: '[platform-admin,service-account-openmetadata-ingestion]'
      AUTHORIZER_PRINCIPAL_DOMAIN: kest.local
      AUTHENTICATION_PROVIDER: custom-oidc
      CUSTOM_OIDC_AUTHENTICATION_PROVIDER_NAME: Kest SSO
      AUTHENTICATION_PUBLIC_KEYS: '[http://keycloak:8080/realms/kest/protocol/openid-connect/certs,http://openmetadata-server:8585/api/v1/system/config/jwks]'
      AUTHENTICATION_AUTHORITY: http://127.0.0.1:8180/realms/kest
      AUTHENTICATION_CLIENT_ID: openmetadata
      AUTHENTICATION_CALLBACK_URL: http://127.0.0.1:8585/callback
      AUTHENTICATION_CLIENT_TYPE: confidential
      OIDC_CLIENT_ID: openmetadata
      OIDC_CLIENT_SECRET: ${OPENMETADATA_OIDC_CLIENT_SECRET}
      OIDC_TYPE: Keycloak
      OIDC_DISCOVERY_URI: http://keycloak:8080/realms/kest/.well-known/openid-configuration
      OIDC_CALLBACK: http://127.0.0.1:8585/callback
      OIDC_SERVER_URL: http://127.0.0.1:8585
    command: ["./bootstrap/openmetadata-ops.sh", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks: [control]
    restart: "no"

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:2.0.5@sha256:ede23602d8e7cc2447e14f67b36d8ee2e468671fb3157a39e776ecfd6d7cc11b
    profiles: [catalog]
    env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
    environment: *om-env
    depends_on:
      openmetadata-migrate:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8585:8585"]
    healthcheck:
      test: ["CMD-SHELL", "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/8585; printf 'GET /healthcheck HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3\""]
      interval: 15s
      timeout: 5s
      retries: 40
    networks: [control, data]
    restart: unless-stopped
    mem_limit: 1536m

  platform-exporter:
    image: ${TOOLING_IMAGE:-kest-tooling:0.1.0}
    profiles: [observability]
    env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
    environment:
      PYTHONPATH: /opt/kest/ingestion
      OPENMETADATA_REQUIRED: ${OPENMETADATA_REQUIRED:-false}
    command: ["python", "/opt/kest/ops/metrics_exporter.py"]
    volumes: ["./:/opt/kest:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9108/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [control, data]
    restart: unless-stopped
    mem_limit: 256m

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    profiles: [observability]
    environment:
      DATA_SOURCE_NAME: postgresql://platform_control:${PLATFORM_CONTROL_PASSWORD}@postgres:5432/platform_control?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    networks: [control]
    restart: unless-stopped
    mem_limit: 128m

  redis-exporter:
    image: ghcr.io/oliver006/redis_exporter:v1.93.0-alpine@sha256:93831cd4d5d67687de67c9d5221b14312fea580af8d157583ed9d4459bf2dd70
    profiles: [observability]
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis: {condition: service_healthy}
    networks: [control]
    restart: unless-stopped
    mem_limit: 128m

  node-exporter:
    image: ghcr.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles: [observability]
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/rootfs"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [control]
    restart: unless-stopped
    mem_limit: 128m

  prometheus:
    image: ghcr.io/prometheus/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/rules/kest.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [platform-exporter, postgres-exporter, redis-exporter, node-exporter]
    networks: [control, data]
    restart: unless-stopped
    mem_limit: 768m

  alertmanager:
    image: ghcr.io/prometheus/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    profiles: [observability]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    depends_on: [platform-exporter]
    networks: [control]
    restart: unless-stopped
    mem_limit: 256m

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    profiles: [observability]
    env_file: ["${KEST_SERVICE_ENV_FILE:-.env}"]
    environment:
      GF_SECURITY_ADMIN_USER: platform-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Kest SSO
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email roles
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://127.0.0.1:8180/realms/kest/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/kest/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/kest/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'platform-admin') && 'Admin' || contains(roles[*], 'data-engineer') && 'Editor' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, keycloak]
    networks: [control]
    restart: unless-stopped
    mem_limit: 512m

networks:
  control:
    internal: false
  data:
    internal: false

volumes:
  postgres-data-v18:
  redis-data:
  clickhouse-data-v26:
  clickhouse-restore-data:
  silo-data:
  airflow-logs:
  opensearch-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
