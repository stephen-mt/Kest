global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: kest-platform
    static_configs:
      - targets: [platform-exporter:9108]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: [clickhouse:9363]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: [keycloak:9000]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
