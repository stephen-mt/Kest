name: kest
version: 1.0.0
config-version: 2
profile: kest
model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
clean-targets: [../.runtime/dbt/target, ../.runtime/dbt/packages]
models:
  kest:
    staging:
      +schema: staging
      +materialized: view
    core:
      +schema: core
      +materialized: view
    marts:
      +schema: gold_candidate
      +materialized: table
      +engine: MergeTree()
      +order_by: tuple()
