[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kest-data-platform"
version = "0.1.0"
description = "Production-like multi-user OSS data platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.40.40",
  "clickhouse-connect==0.9.2",
  "dlt[filesystem]==1.31.0",
  "fastapi==0.117.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "pyarrow==21.0.0",
  "pydantic==2.11.9",
  "PyYAML==6.0.2",
  "tenacity==9.1.2",
  "uvicorn==0.36.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-timeout==2.4.0",
  "ruff==0.13.2",
  "mypy==1.18.2",
]

[tool.setuptools.packages.find]
where = ["ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: requires the running Docker Compose core stack",
  "security: validates permissions at the backing service",
  "recovery: destructive only inside isolated restore targets",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["orchestration/dags"]
